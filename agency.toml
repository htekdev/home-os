# Home OS — Agency Configuration
# This file defines the multi-agent system topology

[system]
name = "Home OS"
version = "1.0.0"
timezone = "America/Chicago"
primary_channel = "telegram"

[system.owners]
# Define family members who interact with the system
# Customize these for your family

[[system.owners.members]]
name = "Parent 1"
role = "admin"
telegram_id = ""

[[system.owners.members]]
name = "Parent 2"
role = "admin"
telegram_id = ""

[agents]
# Agent definitions — each agent owns a specific domain
# Agents are defined in agents/*.agent.md

[agents.daily-briefing]
description = "Morning briefing — weather, calendar, tasks, priorities"
schedule = "0 6 * * *"
priority = "high"

[agents.task-coach]
description = "ADD-friendly productivity coach — serves one task at a time"
schedule = "*/20 6-22 * * *"
priority = "high"

[agents.meal-planner]
description = "Weekly meal planning, recipes, and grocery lists"
schedule = "0 10 * * 6"
priority = "medium"

[agents.finance-manager]
description = "Budget tracking, bill payments, expense categorization"
schedule = "0 9 1 * *"
priority = "medium"

[agents.home-manager]
description = "Home maintenance schedules, service providers, repairs"
schedule = "0 8 * * 1"
priority = "medium"

[agents.health-coach]
description = "Medical appointments, medications, health goals"
schedule = "0 9 * * *"
priority = "high"

[agents.weekly-planner]
description = "Sunday evening planning — review calendar, tasks, priorities"
schedule = "0 19 * * 0"
priority = "medium"

[agents.family-coordinator]
description = "Schedules, logistics, carpool, activities"
schedule = "0 7 * * 1-5"
priority = "medium"

[memory]
# 4-tier memory architecture
tier1 = "core.md"        # Identity, rules, preferences (always loaded)
tier2 = "working.md"     # Current state, today's context (always loaded)
tier3 = "long-term.md"   # Historical patterns, lessons (on-demand)
tier4 = "events.log"     # Chronological event stream (append-only)

[memory.rules]
working_max_kb = 5
always_load = ["core.md", "working.md"]
trim_strategy = "oldest_first"

[governance]
# Constitution governs all agent behavior
constitution = "data/constitution.md"
escalation_channel = "telegram"

[governance.autonomy_levels]
act_immediately = ["investigate", "report", "search", "track", "log"]
ask_first = ["purchase", "delete", "modify_config", "send_external"]
escalate = ["security", "data_loss", "breaking_change", "financial"]

[integrations]
# External service connections
telegram = { enabled = true, config = "config/telegram.env" }
google_calendar = { enabled = true, config = "config/google.env" }
gmail = { enabled = true, config = "config/google.env" }
plaid = { enabled = false, config = "config/plaid.env" }
google_maps = { enabled = true, config = "config/google.env" }
